name: TourSafe Continuous Delivery & Release (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_approval:
        description: 'Bypass staging soak (Emergency only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-package:
    name: Immutable Multi-Stage Container Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build TourSafe API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: toursafe/backend-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: toursafe/backend-api:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Staging Environment Deployment
    needs: build-and-package
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.toursafe.internal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubernetes Kubeconfig
        run: echo "Configuring staging cluster access"

      - name: Run Database Safe Schema Migration
        run: |
          echo "Running database forward migration on staging..."

      - name: Deploy Kubernetes Manifests to Staging
        run: |
          echo "Applying Kustomize staging manifests..."

      - name: Run Synthetic Smoke Test
        run: |
          echo "Running synthetic smoke test against staging endpoint..."

  deploy-production:
    name: Production Environment Deployment
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.toursafe.internal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-Deployment Database Snapshot Drill
        run: |
          echo "Executing automated MongoDB snapshot prior to production release..."

      - name: Deploy Kubernetes Manifests (Rolling Update)
        run: |
          echo "Applying production deployment with zero-downtime rolling update..."

      - name: Post-Deployment Synthetic Smoke Test
        run: |
          echo "Executing automated post-deployment smoke test..."
