# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.toursafe.internal app.toursafe.internal localhost;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production TLS Gateway & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.toursafe.internal app.toursafe.internal localhost;

    # SSL Certificate Configuration
    ssl_certificate /etc/nginx/certs/toursafe.crt;
    ssl_certificate_key /etc/nginx/certs/toursafe.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Production Strict Security Headers (Prompt 29 & 33)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=()" always;

    # Client limits & Buffer Tuning
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    limit_conn conn_limit_per_ip 50;

    # Health Checks (No Rate Limit for Load Balancers & Ingress Probes)
    location ~ ^/(health|health/live|health/ready|health/startup|api/v1/health)$ {
        proxy_pass http://toursafe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Authentication Endpoints with Tight Rate Limiting
    location ~ ^/api/v1/auth/(login|register|refresh|reset-password)$ {
        limit_req zone=rate_limit_auth burst=10 nodelay;
        proxy_pass http://toursafe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # High-Throughput Telemetry Ingestion Endpoint
    location ~ ^/api/v1/telemetry/(batch|stream|ingest)$ {
        limit_req zone=rate_limit_telemetry burst=50 nodelay;
        proxy_pass http://toursafe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        client_max_body_size 2M;
    }

    # Real-Time WebSocket Proxying
    location ~ ^/(ws|ws/|realtime/ws) {
        proxy_pass http://toursafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Standard API Proxying
    location /api/ {
        limit_req zone=rate_limit_general burst=30 nodelay;
        proxy_pass http://toursafe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Authority Command Center Web Frontend
    location / {
        proxy_pass http://toursafe_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
