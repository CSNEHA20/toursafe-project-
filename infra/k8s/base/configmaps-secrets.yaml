apiVersion: v1
kind: ConfigMap
metadata:
  name: toursafe-config
  namespace: toursafe
data:
  ENVIRONMENT: "production"
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  MONGODB_DATABASE: "toursafe"
  MONGODB_MAX_POOL_SIZE: "100"
  MONGODB_MIN_POOL_SIZE: "10"
  MONGODB_TIMEOUT_MS: "5000"
  MONGODB_TLS: "true"
  JWT_ACCESS_EXPIRE_MINUTES: "30"
  JWT_REFRESH_EXPIRE_DAYS: "7"
  JWT_ISSUER: "toursafe-auth-service"
  JWT_AUDIENCE: "toursafe-client-applications"
  CORS_ORIGINS: "https://app.toursafe.internal,https://admin.toursafe.internal"
  WS_PING_INTERVAL_SECONDS: "30"
  WS_MAX_PAYLOAD_BYTES: "65536"
  MAX_REQUEST_BODY_BYTES: "52428800"
  TELEMETRY_RETENTION_DAYS: "30"
  TELEMETRY_NOMINAL_FREQUENCY_HZ: "50.0"
  TELEMETRY_MIN_COMPLETENESS_RATIO: "0.6"
  ML_MODEL_VERSION: "v1.0.0"
  COPILOT_LLM_PROVIDER: "gemini"
  COPILOT_MODEL: "gemini-2.0-flash"
  COPILOT_TEMPERATURE: "0.1"
  STORAGE_PROVIDER: "s3"
  STORAGE_BUCKET_KYC: "toursafe-kyc-vault-private"
  STORAGE_BUCKET_BACKUPS: "toursafe-backups-dr"
---
apiVersion: v1
kind: Secret
metadata:
  name: toursafe-secrets
  namespace: toursafe
type: Opaque
stringData:
  # In production, values are injected via ExternalSecrets / Vault / AWS Secrets Manager
  MONGODB_URI: "mongodb://toursafe_app:REPLACE_WITH_EXTERNAL_VAULT_SECRET@toursafe-mongodb.toursafe.svc.cluster.local:27017/toursafe?authSource=toursafe&tls=true"
  REDIS_URL: "rediss://:REPLACE_WITH_EXTERNAL_VAULT_SECRET@toursafe-redis.toursafe.svc.cluster.local:6379/0"
  JWT_SECRET: "REPLACE_WITH_HIGH_ENTROPY_ROTATED_PRODUCTION_JWT_SECRET_KEY"
  GEMINI_API_KEY: "REPLACE_WITH_VAULT_GEMINI_KEY"
  OPENAI_API_KEY: "REPLACE_WITH_VAULT_OPENAI_KEY"
