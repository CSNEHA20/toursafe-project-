apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toursafe-ingress
  namespace: toursafe
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "toursafe-api-service"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - api.toursafe.internal
        - app.toursafe.internal
      secretName: toursafe-tls-cert
  rules:
    - host: api.toursafe.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toursafe-api-service
                port:
                  number: 8000
