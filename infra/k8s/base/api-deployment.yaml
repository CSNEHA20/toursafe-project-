apiVersion: apps/v1
kind: Deployment
metadata:
  name: toursafe-api
  namespace: toursafe
  labels:
    app.kubernetes.io/name: toursafe-api
    app.kubernetes.io/part-of: toursafe-platform
    app.kubernetes.io/component: backend-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: toursafe-api
  template:
    metadata:
      labels:
        app: toursafe-api
        tier: backend
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: toursafe-api
          image: toursafe/backend-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: toursafe-config
            - secretRef:
                name: toursafe-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: toursafe-api-service
  namespace: toursafe
spec:
  selector:
    app: toursafe-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
