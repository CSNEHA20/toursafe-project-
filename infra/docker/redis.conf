# Redis Production Hardened Configuration
port 6379
bind 0.0.0.0
protected-mode yes
requirepass toursafe_redis_secure_pass_2026

# Memory & Eviction Strategy
# Memory limit set to 512MB for container instance
maxmemory 512mb
# volatile-lru ensures temporary session keys expire, while persistent queue streams are never evicted
maxmemory-policy volatile-lru

# Persistence (Hybrid RDB + AOF for High Durability)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Client & Timeout Limits
timeout 300
tcp-keepalive 60
maxclients 10000

# Logging
loglevel notice
logfile ""
